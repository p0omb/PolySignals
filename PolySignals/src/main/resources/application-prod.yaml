spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_HIKARI_MAX_POOL_SIZE:12}
      minimum-idle: ${DB_HIKARI_MIN_IDLE:3}
      connection-timeout: ${DB_HIKARI_CONNECTION_TIMEOUT_MS:30000}
  application:
    name: PolySignals
  jpa:
    show-sql: false

app:
  scheduling:
    whale-update:
      enabled: false

  cache:
    type: caffeine

  security:
    user:
      name: ${ADMIN_NAME:admin}
      password: ${ADMIN_PASSWORD}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  server:
    port: 9091
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  security:
    enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: WARN
    ru.gbp.PolySignals: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
    org.springframework.data: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/polysignals.log
    max-size: 10MB
    max-history: 30
    total-size-cap: 1GB

server:
  port: 8080
  servlet:
    context-path: /api
  shutdown: graceful
  http2:
    enabled: true
  ssl:
    enabled: false  # Включать через reverse proxy (nginx)