spring:
  application:
    name: PolySignals

  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/whale_tracker}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_HIKARI_MIN_IDLE:2}
      connection-timeout: ${DB_HIKARI_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_HIKARI_IDLE_TIMEOUT_MS:600000}   # 10m: освобождает лишние idle-коннекты без лишнего churn
      max-lifetime: ${DB_HIKARI_MAX_LIFETIME_MS:1800000}  # 30m: плановое обновление коннектов до "устаревания"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cache:
    type: simple

  jackson:
    time-zone: UTC

# Настройки интеграций и бизнес-параметров
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    chat-id: ${TELEGRAM_CHAT_ID}
    api-base-url: ${TELEGRAM_API_BASE_URL:https://api.telegram.org}

polymarket:
  data-api:
    base-url: ${POLYMARKET_DATA_API_BASE_URL:https://data-api.polymarket.com}
  gamma-api:
    base-url: ${POLYMARKET_GAMMA_API_BASE_URL:https://gamma-api.polymarket.com}

app:
  whales:
    top-limit: ${WHALES_TOP_LIMIT:100}
  signal:
    cooldown: ${SIGNAL_COOLDOWN:24h}
    window: ${SIGNAL_WINDOW:6h}
    backup-period: ${SIGNAL_BACKUP_PERIOD:7d}
  polymarket:
    retry:
      max-attempts: ${POLYMARKET_RETRY_MAX_ATTEMPTS:3}
      initial-delay: ${POLYMARKET_RETRY_INITIAL_DELAY:1s}
      multiplier: ${POLYMARKET_RETRY_MULTIPLIER:2.0}
  cleanup:
    signals-retention: ${SIGNALS_RETENTION:P30D}
    bets-retention: ${BETS_RETENTION:P90D}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: Whale signal detector for Polymarket
    version: 1.0.0

logging:
  level:
    root: INFO
    ru.gbp.PolySignals: INFO
