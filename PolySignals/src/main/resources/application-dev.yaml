spring:
  jpa:
    show-sql: false
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO
    ru.gbp.PolySignals: DEBUG
    org.springframework.web.reactive.function.client: INFO
